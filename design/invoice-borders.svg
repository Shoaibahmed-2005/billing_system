<!-- ============================== foot ============================== -->
<line x1="80" y1="1668" x2="1160" y2="1668" stroke="#14110c" stroke-width="1.6"/>
<text x="80" y="1698" font-size="15" fill="#6d6557">The grey skeleton inside each frame is the real bill geometry — header, items, totals, HSN table, footer — untouched.</text>
<text x="1160" y="1698" text-anchor="end" font-size="15" font-style="italic" fill="#6d6557">Pick one and I will build it.</text>
</svg>
