      <path d="M42 0 A42 42 0 0 1 0 42" stroke-width="1.2"/>
      <path d="M54 0 A54 54 0 0 1 0 54" stroke-width="1.2"/>
    </g>
  </g>
  <g fill="#14110c">
    <polygon points="46,46 54,38 62,46 54,54"/>
    <polygon points="474,46 466,38 458,46 466,54"/>
    <polygon points="46,554 54,562 62,554 54,546"/>
    <polygon points="474,554 466,562 458,554 466,546"/>
  </g>
  <path d="M166 16 L182 1 H338 L354 16 L338 31 H182 Z" fill="#faf7f0" stroke="#14110c" stroke-width="2.4"/>
  <rect x="196" y="10" width="128" height="12" fill="#14110c"/>
