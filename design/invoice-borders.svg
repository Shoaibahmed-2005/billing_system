<rect width="1240" height="1754" fill="#faf7f0"/>

<!-- ============================ masthead ============================ -->
<g stroke="#14110c" fill="none">
  <line x1="80" y1="62" x2="1160" y2="62" stroke-width="6"/>
  <line x1="80" y1="74" x2="1160" y2="74" stroke-width="1.6"/>
  <line x1="80" y1="212" x2="1160" y2="212" stroke-width="1.6"/>
  <line x1="80" y1="220" x2="1160" y2="220" stroke-width="4"/>
</g>
<text x="620" y="110" text-anchor="middle" font-size="19" letter-spacing="11" fill="#5a5245">NAVEEN AIRTECH · CHENGALPATTU</text>
<text x="620" y="166" text-anchor="middle" font-size="46" font-weight="bold" fill="#14110c">Border Studies for the Printed Bill</text>
<text x="620" y="196" text-anchor="middle" font-size="17" font-style="italic" fill="#6d6557">Four newsprint frames, each costing under 2 mm of the A4 sheet</text>

<!-- ============================== I ================================= -->
<text x="80" y="268" font-size="20" font-weight="bold" letter-spacing="4" fill="#14110c">I · OXFORD RULE</text>
<text x="80" y="290" font-size="15" font-style="italic" fill="#6d6557">The broadsheet standard — one fat rule, one hairline, nothing else.</text>
<g transform="translate(80,300)">
  <use href="#guts" x="24" y="24"/>
  <rect x="2.5" y="2.5" width="515" height="595" fill="none" stroke="#14110c" stroke-width="5"/>
  <rect x="13" y="13" width="494" height="574" fill="none" stroke="#14110c" stroke-width="1.5"/>
</g>

<!-- ============================== II ================================ -->
<text x="640" y="268" font-size="20" font-weight="bold" letter-spacing="4" fill="#14110c">II · BOLTED PLATE</text>
<text x="640" y="290" font-size="15" font-style="italic" fill="#6d6557">Same rules, hex bolt heads on the seams. The bill as a machined panel.</text>
<g transform="translate(640,300)">
  <use href="#guts" x="24" y="24"/>
  <rect x="2" y="2" width="516" height="596" fill="none" stroke="#14110c" stroke-width="4"/>
  <rect x="12" y="12" width="496" height="576" fill="none" stroke="#14110c" stroke-width="1.5"/>
  <use href="#bolt" x="12" y="12"/><use href="#bolt" x="508" y="12"/>
  <use href="#bolt" x="12" y="588"/><use href="#bolt" x="508" y="588"/>
  <use href="#bolt" x="260" y="12"/><use href="#bolt" x="260" y="588"/>
  <use href="#bolt" x="12" y="300"/><use href="#bolt" x="508" y="300"/>
</g>

<!-- ============================= III ================================ -->
<text x="80" y="978" font-size="20" font-weight="bold" letter-spacing="4" fill="#14110c">III · GAUGE SCALE</text>
<text x="80" y="1000" font-size="15" font-style="italic" fill="#6d6557">A pressure-gauge rule runs the whole perimeter. Precise, not pretty.</text>
<g transform="translate(80,1010)">
  <use href="#guts" x="24" y="24"/>
  <rect x="5" y="5" width="510" height="10" fill="url(#tickV)"/>
  <rect x="5" y="585" width="510" height="10" fill="url(#tickV)"/>
  <rect x="5" y="5" width="10" height="590" fill="url(#tickH)"/>
  <rect x="505" y="5" width="10" height="590" fill="url(#tickH)"/>
  <g fill="#14110c">
    <rect x="2" y="2" width="18" height="18"/><rect x="500" y="2" width="18" height="18"/>
    <rect x="2" y="580" width="18" height="18"/><rect x="500" y="580" width="18" height="18"/>
  </g>
  <rect x="1.75" y="1.75" width="516.5" height="596.5" fill="none" stroke="#14110c" stroke-width="3.5"/>
  <rect x="17" y="17" width="486" height="566" fill="none" stroke="#14110c" stroke-width="1"/>
</g>

<!-- ============================== IV ================================ -->
<text x="640" y="978" font-size="20" font-weight="bold" letter-spacing="4" fill="#14110c">IV · AIR CREST</text>
<text x="640" y="1000" font-size="15" font-style="italic" fill="#6d6557">Blast-waves in the corners, a masthead plate breaking the top rule.</text>
<g transform="translate(640,1010)">
  <use href="#guts" x="24" y="24"/>
  <rect x="2" y="2" width="516" height="596" fill="none" stroke="#14110c" stroke-width="4"/>
  <rect x="11" y="11" width="498" height="578" fill="none" stroke="#14110c" stroke-width="1"/>
